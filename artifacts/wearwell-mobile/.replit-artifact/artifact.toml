kind = "mobile"
previewPath = "/wearwell-mobile/"
title = "Wearwell Mobile"
description = "Wearwell for iOS and Android, with account sync, wardrobe tools, outfit planning, and weather."
version = "1.0.0"
id = "artifacts/wearwell-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/wearwell-mobile/" ]
localPort = 20712

[services.development]
run = "pnpm --filter @workspace/wearwell-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/wearwell-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/wearwell-mobile", "run", "serve" ]

[services.env]
PORT = "20712"
BASE_PATH = "/wearwell-mobile/"
